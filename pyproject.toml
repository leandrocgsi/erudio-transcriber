[project]
name = "erudio-transcriber"
version = "0.1.0"
description = "Local video transcription with vocabulary hints, slide-change frames and a thermal guard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.scripts]
erudio-transcriber = "erudio_transcriber.cli:main"

[project.gui-scripts]
erudio-transcriber-gui = "erudio_transcriber.ui.qt.app:main"

[project.entry-points."erudio_transcriber.transcribers"]
faster-whisper = "erudio_transcriber.drivers.faster_whisper_driver:create_transcriber"

[project.entry-points."erudio_transcriber.audio_extractors"]
ffmpeg = "erudio_transcriber.drivers.ffmpeg_audio:create_audio_extractor"

[project.entry-points."erudio_transcriber.slide_detectors"]
ffmpeg = "erudio_transcriber.drivers.ffmpeg_slides:create_slide_detector"

[project.entry-points."erudio_transcriber.frame_extractors"]
ffmpeg = "erudio_transcriber.drivers.ffmpeg_frames:create_frame_extractor"

[project.entry-points."erudio_transcriber.thermal_sensors"]
nvidia-smi = "erudio_transcriber.drivers.nvidia_smi:create_thermal_sensor"

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1", "nvidia-cublas-cu12", "nvidia-cudnn-cu12"]
qt = ["PySide6>=6.8"]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8", "mypy>=1.13"]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/erudio_transcriber"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "RUF", "PL", "C4", "PT"]
ignore = ["PLR2004", "PLR0913", "PLR0917", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603"]
"src/erudio_transcriber/drivers/**" = ["S603", "S607"]
"src/erudio_transcriber/drivers/faster_whisper_driver.py" = ["PLC0415"]

[tool.mypy]
strict = true
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
branch = true
source = ["src/erudio_transcriber"]
omit = ["*/ports/*", "*/ui/*", "*/faster_whisper_driver.py"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
